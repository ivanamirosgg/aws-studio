<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Cloud Practitioner — Sala de Estudio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #0B1220;
    --surface: #131D30;
    --surface-raised: #1A2540;
    --border: #26344A;
    --border-soft: #1E2A40;
    --amber: #F2A65A;
    --amber-dim: #7A5A34;
    --teal: #4FD9C8;
    --teal-dim: #1F4A45;
    --coral: #F4735B;
    --coral-dim: #4A2620;
    --text: #EAF0F6;
    --muted: #8FA1B8;
    --muted-2: #5D7089;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    min-height: 100vh;
  }

  body{
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 34px 34px;
    display:flex;
    justify-content:center;
    padding: 28px 16px 60px;
  }

  .app{ width:100%; max-width: 780px; }
  .mono{ font-family: 'IBM Plex Mono', monospace; }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 16px;
    margin-bottom: 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--border-soft);
  }
  .brand h1{ font-size: 1.35rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: -0.01em; }
  .brand p{ margin:0; color: var(--muted); font-size: 0.82rem; }
  .brand .tag{ color: var(--amber); font-family:'IBM Plex Mono', monospace; font-size: 0.72rem; letter-spacing: 0.03em; }
  .clf-badge{
    font-family:'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--amber);
    border: 1px solid var(--amber-dim); padding: 5px 10px; border-radius: 3px;
    background: rgba(242,166,90,0.06); white-space: nowrap; height: fit-content;
  }

  .cat-scroll{ display:flex; gap:8px; overflow-x:auto; padding-bottom: 6px; margin-bottom: 18px; }
  .cat-scroll::-webkit-scrollbar{ height: 4px; }
  .cat-scroll::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 2px; }
  .chip{
    flex: 0 0 auto; font-family:'IBM Plex Mono', monospace; font-size: 0.72rem;
    padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted); cursor: pointer;
    transition: all 0.15s ease; white-space: nowrap;
  }
  .chip:hover{ border-color: var(--muted-2); color: var(--text); }
  .chip.active{ background: var(--amber); border-color: var(--amber); color: #1A1204; font-weight: 600; }

  .stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
  .stat{ background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 12px; }
  .stat .num{ font-size: 1.25rem; font-weight: 700; line-height:1; display:block; margin-bottom: 4px; }
  .stat .lbl{ font-family:'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat.streak .num{ color: var(--amber); }
  .stat.mastered .num{ color: var(--teal); }
  .stat.review .num{ color: var(--coral); }

  .progress-track{ height: 5px; background: var(--surface); border-radius: 4px; overflow: hidden; margin-bottom: 26px; border: 1px solid var(--border-soft); }
  .progress-fill{ height: 100%; background: linear-gradient(90deg, var(--amber), var(--teal)); width: 0%; transition: width 0.35s ease; }

  .mc-panel{
    background: linear-gradient(160deg, var(--surface-raised), var(--surface));
    border: 1px solid var(--border); border-radius: 14px; padding: 26px 24px; min-height: 300px;
    position: relative;
  }
  .mc-panel .kicker{ font-family:'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--teal); letter-spacing: 0.03em; margin-bottom: 14px; }
  .mc-panel .body-text{ font-size: 1.12rem; line-height: 1.45; font-weight: 500; margin-bottom: 20px; }
  .mc-options{ display:flex; flex-direction:column; gap:9px; }
  .mc-option{
    text-align:left; font-family:'Space Grotesk', sans-serif; font-size: 0.9rem; font-weight: 500;
    padding: 12px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; transition: all 0.15s ease;
    display:flex; align-items:center; gap: 12px;
  }
  .opt-letter{
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight: 600; color: var(--muted);
  }
  .mc-option.correct-answer .opt-letter{ background: var(--teal); border-color: var(--teal); color: #052622; }
  .mc-option.wrong-answer .opt-letter{ background: var(--coral); border-color: var(--coral); color: #3A0D06; }
  .mc-option:hover:not(:disabled){ border-color: var(--amber-dim); background: rgba(242,166,90,0.06); }
  .mc-option:disabled{ cursor:default; }
  .mc-option.correct-answer{ border-color: var(--teal); background: rgba(79,217,200,0.14); color: #C9FBF3; }
  .mc-option.wrong-answer{ border-color: var(--coral); background: rgba(244,115,91,0.14); color: #FFD9D1; }
  .mc-option.dimmed{ opacity: 0.45; }

  .mc-feedback{
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-soft);
  }
  .mc-feedback .verdict{ font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; }
  .mc-feedback .verdict.ok{ color: var(--teal); }
  .mc-feedback .verdict.bad{ color: var(--coral); }
  .mc-feedback .explain{ font-size: 0.92rem; color: var(--muted); line-height: 1.5; }

  .badge-tag{
    display:inline-block; margin-top: 12px; font-family:'IBM Plex Mono', monospace; font-size: 0.65rem;
    padding: 4px 9px; border-radius: 12px; width: fit-content; border: 1px solid var(--border); color: var(--muted);
  }
  .badge-tag.trap{ color: var(--coral); border-color: var(--coral-dim); background: rgba(244,115,91,0.08); }
  .badge-tag.mnemo{ color: #C9A6F2; border-color: #4A3A5C; background: rgba(201,166,242,0.07); }
  .badge-tag.rule{ color: var(--amber); border-color: var(--amber-dim); background: rgba(242,166,90,0.07); }

  .controls{ display:flex; gap: 10px; margin-bottom: 10px; margin-top: 16px; }
  .btn{
    flex:1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.92rem;
    padding: 14px 10px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer; transition: transform 0.1s ease, background 0.15s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.ghost{ background: transparent; color: var(--muted); }
  .btn.ghost:hover{ color: var(--text); }
  .btn.review-btn{ border-color: var(--coral-dim); }
  .btn.review-btn:hover{ background: rgba(244,115,91,0.1); }
  .btn.know-btn{ border-color: var(--teal-dim); }
  .btn.know-btn:hover{ background: rgba(79,217,200,0.1); }
  .btn.next-btn{ width:100%; background: var(--teal); color: #052622; border:none; }
  .btn.next-btn:hover{ filter: brightness(1.08); }

  .util-row{ display:flex; justify-content: space-between; align-items:center; margin-top: 6px; }
  .util-row button{
    background:none; border:none; color: var(--muted-2); font-family:'IBM Plex Mono', monospace;
    font-size: 0.72rem; cursor:pointer; text-decoration: underline;
  }
  .util-row button:hover{ color: var(--muted); }

  .end-screen{ text-align:center; padding: 40px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .end-screen .big-score{ font-size: 2.6rem; font-weight: 700; color: var(--amber); margin: 6px 0 2px; }
  .end-screen p{ color: var(--muted); font-size: 0.9rem; margin: 4px 0 24px; }
  .end-actions{ display:flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }

  .empty-note{ text-align:center; color: var(--muted); padding: 60px 20px; font-size: 0.9rem; }

  @media (max-width: 480px){
    .stats{ grid-template-columns: repeat(2,1fr); }
    header{ flex-direction: column; }
    .clf-badge{ align-self: flex-start; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------------- DATA ---------------- */
const CATEGORIES = [
  { id: 'fund', name: 'Fundamentos' },
  { id: 'resp', name: 'Resp. Compartida' },
  { id: 'infra', name: 'Infra Global' },
  { id: 'compute', name: 'Cómputo' },
  { id: 'storage', name: 'Almacenamiento' },
  { id: 'db', name: 'Bases de Datos' },
  { id: 'net', name: 'Redes' },
  { id: 'mig', name: 'Migración' },
  { id: 'sec', name: 'Seguridad' },
  { id: 'integ', name: 'Integración & AI/ML' },
  { id: 'dev', name: 'DevTools & Gobierno' },
  { id: 'price', name: 'Precios' },
  { id: 'support', name: 'Soporte' },
];

const CARDS = [
// FUNDAMENTOS
{cat:'fund', q:'¿Cuál es la definición oficial de AWS de "cloud computing"?', a:'La entrega bajo demanda de recursos de TI a través de internet con pago por uso.',
  mc:{correct:'Entrega bajo demanda de TI por internet con pago por uso', options:['Entrega bajo demanda de TI por internet con pago por uso','Comprar servidores físicos y mantenerlos en tu oficina','Un contrato anual obligatorio de hardware','Alquilar oficinas en distintos países']}},
{cat:'fund', q:'En el modelo IaaS (ej. Amazon EC2), ¿qué recurso queda bajo el control total del cliente?', a:'AWS controla hardware físico, edificios y virtualización. El cliente controla el SO, parches, aplicaciones, datos y red lógica.',
  mc:{correct:'El sistema operativo y sus parches', options:['El sistema operativo y sus parches','El hardware físico del servidor','La virtualización subyacente','Los centros de datos']}},
{cat:'fund', q:'Una empresa quiere conectar su datacenter local con AWS para ejecutar algunas cargas on-premises y otras en la nube al mismo tiempo. ¿Qué modelo de nube está describiendo?', a:'Nube híbrida — combina infraestructura propia con la nube pública (ej. mediante Direct Connect, Storage Gateway u Outposts).',
  mc:{correct:'Nube híbrida', options:['Nube híbrida','Nube pública','Nube privada','Nube comunitaria']}},
{cat:'fund', q:'"Menor costo por unidad al comprar en volumen" — ¿a cuál de las 6 ventajas de la nube corresponde?', a:'Economías de escala — AWS compra masivo y traslada el ahorro al cliente (analogía Costco).',
  mc:{correct:'Economías de escala', options:['Economías de escala','Elasticidad','Alta disponibilidad','CAPEX a OPEX']}},
{cat:'fund', q:'Una app escala de 5 a 20 servidores en un pico y regresa a 5 sola, sin intervención humana. ¿Qué ventaja de la nube es?', a:'Dejar de adivinar la capacidad necesaria → Elasticidad.', badge:'trap',
  mc:{correct:'Elasticidad', options:['Elasticidad','Escalabilidad horizontal','Alta disponibilidad','Multi-tenancy']}},
{cat:'fund', q:'¿Qué es "multi-tenancy" en la nube pública?', a:'Múltiples clientes comparten la infraestructura física de AWS, pero están completamente aislados entre sí por virtualización y controles de seguridad.',
  mc:{correct:'Aislados por virtualización y controles de seguridad', options:['Aislados por virtualización y controles de seguridad','Cada cliente tiene su propio datacenter físico','Los clientes comparten un solo usuario y contraseña','AWS asigna un país exclusivo por cliente']}},
{cat:'fund', q:'En SaaS, ¿qué controla el cliente? Da un ejemplo AWS.', a:'Solo sus datos y configuraciones de usuario. AWS gestiona todo lo técnico. Ejemplos: Amazon QuickSight, Amazon WorkMail.',
  mc:{correct:'Solo sus datos y configuración de usuario', options:['Solo sus datos y configuración de usuario','El sistema operativo y los parches','El hardware físico del datacenter','La red troncal global de AWS']}},

// RESPONSABILIDAD COMPARTIDA
{cat:'resp', q:'Regla de oro del Modelo de Responsabilidad Compartida.', a:'AWS = seguridad DE la nube (infraestructura física, hardware, red). Cliente = seguridad EN la nube (datos, accesos, configuración, parches del SO en IaaS).', badge:'rule',
  mc:{correct:'AWS = de la nube · Cliente = en la nube', options:['AWS = de la nube · Cliente = en la nube','AWS = en la nube · Cliente = de la nube','AWS es responsable de todo siempre','El cliente es responsable de todo siempre']}},
{cat:'resp', q:'¿Quién parchea el sistema operativo en Amazon EC2?', a:'El cliente — EC2 es IaaS.', badge:'trap',
  mc:{correct:'El cliente', options:['El cliente','AWS','Ambos por partes iguales','Nadie, se actualiza solo']}},
{cat:'resp', q:'¿Quién parchea el motor de base de datos en Amazon RDS?', a:'AWS — RDS es un servicio administrado (PaaS).', badge:'trap',
  mc:{correct:'AWS', options:['AWS','El cliente','Ambos por partes iguales','Un tercero certificado']}},
{cat:'resp', q:'En AWS Lambda (serverless), ¿quién es responsable del escalado?', a:'AWS — el cliente solo escribe el código; AWS gestiona hardware, SO, runtime y escalado.',
  mc:{correct:'AWS', options:['AWS','El cliente','Ambos','Un Auto Scaling Group manual']}},
{cat:'resp', q:'¿Qué es siempre responsabilidad de AWS, sin importar el servicio?', a:'La seguridad física de los centros de datos y el hardware subyacente.',
  mc:{correct:'La seguridad física de los datacenters y el hardware', options:['La seguridad física de los datacenters y el hardware','El cifrado de los datos del cliente','Los permisos IAM de los usuarios','El código de las aplicaciones del cliente']}},
{cat:'resp', q:'En Amazon S3, ¿quién decide si los datos se cifran y con qué clave?', a:'El cliente — AWS aporta durabilidad e infraestructura, pero el cliente controla cifrado, políticas de acceso y versionado.',
  mc:{correct:'El cliente decide si cifra y con qué clave', options:['El cliente decide si cifra y con qué clave','AWS cifra todo automáticamente sin opción','Nadie puede cifrar datos en S3','Solo el soporte Enterprise puede cifrar']}},
{cat:'resp', q:'¿Qué certificaciones hereda automáticamente una empresa al usar la infraestructura de AWS?', a:'ISO 27001, SOC 1/2/3, PCI DSS y HIPAA.',
  mc:{correct:'ISO 27001, SOC 1/2/3, PCI DSS y HIPAA', options:['ISO 27001, SOC 1/2/3, PCI DSS y HIPAA','Solo ISO 9001','Ninguna, cada cliente debe certificarse solo','GDPR exclusivamente']}},

// INFRAESTRUCTURA GLOBAL
{cat:'infra', q:'¿Cuántas AZs mínimo tiene una Región de AWS?', a:'Mínimo 2 (generalmente 3 o más).',
  mc:{correct:'Mínimo 2', options:['Mínimo 2','Mínimo 1','Mínimo 5','Mínimo 10']}},
{cat:'infra', q:'¿Qué componente de la infraestructura AWS son puntos de caché en más de 90 ciudades, usados por CloudFront, Route 53, Shield y WAF?', a:'Edge Locations — más de 400 ubicaciones que acercan el contenido al usuario final.',
  mc:{correct:'Edge Locations', options:['Edge Locations','Availability Zones','Local Zones','Regiones']}},
{cat:'infra', q:'Una aplicación en AWS sigue funcionando sin interrupciones para el usuario incluso cuando falla un componente individual. ¿Qué característica de la nube está en juego?', a:'Alta Disponibilidad. La Elasticidad se refiere a ajustarse a la demanda, y la Escalabilidad a la capacidad de crecer.', badge:'trap',
  mc:{correct:'Alta disponibilidad', options:['Alta disponibilidad','Elasticidad','Escalabilidad','Multi-tenancy']}},
{cat:'infra', q:'Una empresa necesita latencia menor a 5 milisegundos para una app de realidad aumentada conectada a redes 5G. ¿Qué infraestructura de AWS deberían usar?', a:'AWS Wavelength — infraestructura de cómputo dentro de las redes 5G de operadores de telecomunicaciones. Las Local Zones ofrecen latencia <10ms pero no están integradas en la red 5G.',
  mc:{correct:'AWS Wavelength', options:['AWS Wavelength','AWS Local Zones','Amazon CloudFront','AWS Outposts']}},
{cat:'infra', q:'Un equipo agrega más instancias EC2 idénticas para manejar más tráfico, en lugar de aumentar la CPU/RAM de una sola instancia. ¿Qué tipo de escalado están usando?', a:'Escalado horizontal (Scale Out) — sin los límites físicos del escalado vertical (Scale Up), que solo agranda una misma máquina.',
  mc:{correct:'Escalado horizontal', options:['Escalado horizontal','Escalado vertical','Elasticidad','Alta disponibilidad']}},
{cat:'infra', q:'¿Cuál de las siguientes NO es uno de los 4 factores que AWS recomienda considerar al elegir una Región?', a:'Los 4 factores reales son: cumplimiento legal/residencia de datos, latencia hacia usuarios, disponibilidad de servicios en la región, y precio.',
  mc:{correct:'El número de empleados de AWS en esa región', options:['El número de empleados de AWS en esa región','La latencia hacia los usuarios finales','El cumplimiento legal y la residencia de datos','La disponibilidad de servicios en esa región']}},
{cat:'infra', q:'Una tienda en línea diseña su arquitectura para desplegarse en varias Availability Zones (AZs) dentro de la misma Región. ¿Cuál es la razón principal?', a:'Si una AZ falla (corte de energía, incendio, desastre natural), las demás siguen funcionando — evitando que una caída de horas cueste más que una arquitectura Multi-AZ.',
  mc:{correct:'Para que la aplicación siga funcionando si una AZ falla', options:['Para que la aplicación siga funcionando si una AZ falla','Para reducir el número total de servidores necesarios','Para evitar pagar por almacenamiento en S3','Para cumplir el límite de una sola cuenta AWS']}},

// CÓMPUTO
{cat:'compute', q:'¿Cuál servicio de cómputo es serverless, cobra por milisegundo y tiene máximo 15 min de ejecución?', a:'AWS Lambda.',
  mc:{correct:'AWS Lambda', options:['AWS Lambda','Amazon EC2','AWS Fargate','Amazon Lightsail']}},
{cat:'compute', q:'Una empresa con cargas de big data interrumpibles busca el mayor ahorro en EC2. ¿Qué modelo de compra usa?', a:'Spot Instances — hasta 90% de descuento; interrumpibles con 2 minutos de aviso.',
  mc:{correct:'Spot Instances', options:['Spot Instances','Reserved Instances','On-Demand','Dedicated Host']}},
{cat:'compute', q:'Una empresa quiere comprometerse a un gasto de $10/hora en cómputo pero necesita flexibilidad para cambiar entre tipos de instancia, regiones, y usar Lambda o Fargate sin perder el descuento. ¿Qué modelo de precios de EC2 conviene?', a:'Savings Plans — reserva un monto en $/hora aplicable a cualquier tipo/región de EC2, Lambda y Fargate. Reserved Instances, en cambio, ata el descuento a un tipo de instancia específico.',
  mc:{correct:'Savings Plans', options:['Savings Plans','Reserved Instances','Spot Instances','On-Demand']}},
{cat:'compute', q:'¿Qué modelo de compra de EC2 te permite elegir exactamente qué servidor físico usas, ideal para licencias por socket/núcleo (BYOL)?', a:'Dedicated Host. La Dedicated Instance, en cambio, garantiza hardware exclusivo pero sin que tú elijas el servidor físico específico.', badge:'trap',
  mc:{correct:'Dedicated Host', options:['Dedicated Host','Dedicated Instance','Spot Instance','Savings Plan']}},
{cat:'compute', q:'Una empresa quiere ejecutar contenedores en AWS sin la complejidad de gestionar las instancias EC2 subyacentes. ¿Qué servicio deben usar?', a:'AWS Fargate — motor de cómputo serverless para contenedores, funciona tanto con ECS como con EKS.',
  mc:{correct:'AWS Fargate', options:['AWS Fargate','Amazon EC2','AWS Lambda','Amazon Lightsail']}},
{cat:'compute', q:'Un proceso de renderizado de video requiere varias horas de cómputo intensivo con alto uso de CPU y memoria. ¿Qué servicio es más adecuado que AWS Lambda para esta carga?', a:'AWS Batch — diseñado para trabajos largos sin límite de tiempo. Lambda tiene un máximo de 15 minutos de ejecución.',
  mc:{correct:'AWS Batch', options:['AWS Batch','AWS Lambda','Amazon SNS','AWS Step Functions']}},
{cat:'compute', q:'¿Qué servicio orquesta múltiples Lambdas en un flujo de trabajo visual, con orden, condiciones y manejo de errores?', a:'AWS Step Functions.',
  mc:{correct:'AWS Step Functions', options:['AWS Step Functions','Amazon EventBridge','AWS Batch','Amazon SQS']}},
{cat:'compute', q:'Una empresa quiere recomendaciones automáticas de "rightsizing" para sus instancias EC2, funciones Lambda y volúmenes EBS, generadas con machine learning. ¿Qué servicio deben usar?', a:'AWS Compute Optimizer. Trusted Advisor, en cambio, revisa una gama más amplia de 5 categorías (costo, seguridad, rendimiento, tolerancia a fallos y límites de servicio).',
  mc:{correct:'AWS Compute Optimizer', options:['AWS Compute Optimizer','AWS Trusted Advisor','Amazon CloudWatch','AWS Cost Explorer']}},
{cat:'compute', q:'Una aplicación web necesita distribuir automáticamente el tráfico entrante entre varias instancias EC2 saludables. ¿Qué servicio se encarga de esto?', a:'Elastic Load Balancing (ELB). Auto Scaling, en cambio, agrega o quita instancias según la demanda — suelen usarse juntos.', badge:'trap',
  mc:{correct:'Elastic Load Balancing (ELB)', options:['Elastic Load Balancing (ELB)','Auto Scaling','Amazon Route 53','AWS Global Accelerator']}},

// ALMACENAMIENTO
{cat:'storage', q:'¿Cuál es la clase de S3 más barata para retención de años, con acceso casi nulo?', a:'S3 Glacier Deep Archive — recuperación en 12-48 horas, la más económica.',
  mc:{correct:'S3 Glacier Deep Archive', options:['S3 Glacier Deep Archive','S3 Glacier Flexible Retrieval','S3 One Zone-IA','S3 Standard-IA']}},
{cat:'storage', q:'Una empresa guarda copias de datos no críticos y quiere el precio más bajo dentro de las clases de acceso infrecuente, aceptando el riesgo de perderlos si una sola instalación falla. ¿Qué clase de S3 deben usar?', a:'S3 One Zone-IA — replica en solo 1 AZ (las demás clases usan mínimo 3), por eso es más barata pero arriesgada.', badge:'trap',
  mc:{correct:'S3 One Zone-IA', options:['S3 One Zone-IA','S3 Standard-IA','S3 Standard','S3 Glacier Deep Archive']}},
{cat:'storage', q:'Varias instancias EC2 en distintas AZs necesitan leer y escribir simultáneamente en el mismo sistema de archivos compartido. ¿Qué servicio deben usar?', a:'Amazon EFS — sistema de archivos de red montable por múltiples instancias a la vez. EBS solo se conecta a una instancia.',
  mc:{correct:'Amazon EFS', options:['Amazon EFS','Amazon EBS','Amazon S3','Instance Store']}},

CARDS.forEach((c,i)=>{ c.id = i; });

/* ---------------- STATE ---------------- */
let state = {
  activeCat: 'all',
  deck: [],       // array of {card, shuffledOptions}
  index: 0,
  answered: false,
  selectedIdx: null,
  lastCorrect: null,
  streak: 0,
  bestStreak: 0,
  masteredIds: new Set(),   // answered correctly at least once
  reviewIds: new Set(),     // answered incorrectly last time
  correctCount: 0,
  sessionDone: false,
};

const LETTERS = ['A','B','C','D'];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildDeckItems(catId){
  const pool = catId === 'all' ? CARDS : CARDS.filter(c=>c.cat===catId);
  return shuffle(pool).map(card => ({ card, shuffledOptions: shuffle(card.mc.options) }));
}

function startDeck(catId, reviewOnly=false){
  state.activeCat = catId;
  let items;
  if(reviewOnly){
    const failedCards = CARDS.filter(c=>state.reviewIds.has(c.id));
    items = shuffle(failedCards).map(card => ({ card, shuffledOptions: shuffle(card.mc.options) }));
  } else {
    items = buildDeckItems(catId);
  }
  state.deck = items;
  state.index = 0;
  state.answered = false;
  state.selectedIdx = null;
  state.lastCorrect = null;
  state.correctCount = 0;
  state.sessionDone = items.length === 0;
  render();
}

function catName(id){
  if(id==='all') return 'Todas';
  const c = CATEGORIES.find(c=>c.id===id);
  return c ? c.name : id;
}

function badgeLabel(b){
  if(b==='trap') return '⚠️ Trampa común';
  if(b==='mnemo') return '🧠 Mnemónico';
  if(b==='rule') return '📌 Regla clave';
  return null;
}

/* ---------------- ACTIONS ---------------- */
function selectOption(idx){
  if(state.answered) return;
  const item = state.deck[state.index];
  const chosenText = item.shuffledOptions[idx];
  const isCorrect = chosenText === item.card.mc.correct;
  state.answered = true;
  state.selectedIdx = idx;
  state.lastCorrect = isCorrect;

  const cardId = item.card.id;
  if(isCorrect){
    state.masteredIds.add(cardId);
    state.reviewIds.delete(cardId);
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    state.correctCount += 1;
  } else {
    state.reviewIds.add(cardId);
    state.masteredIds.delete(cardId);
    state.streak = 0;
  }
  render();
}

function nextQuestion(){
  state.answered = false;
  state.selectedIdx = null;
  state.lastCorrect = null;
  if(state.index + 1 >= state.deck.length){
    state.sessionDone = true;
  } else {
    state.index += 1;
  }
  render();
}

function restartSame(){
  startDeck(state.activeCat, false);
}

function reviewFailed(){
  startDeck(state.activeCat, true);
}

/* ---------------- RENDER ---------------- */
function render(){
  const app = document.getElementById('app');
  const total = state.deck.length;
  const progressPct = total > 0 ? Math.min(100, Math.round((state.sessionDone ? total : state.index) / total * 100)) : 0;

  const chips = CATEGORIES.map(c => `
    <button class="chip ${state.activeCat===c.id?'active':''}" onclick="startDeck('${c.id}')">${c.name}</button>
  `).join('');

  let stageHtml = '';

  if(total === 0){
    stageHtml = `<div class="empty-note">No hay preguntas marcadas "por repasar" todavía en esta categoría. ¡Sigue estudiando! 🎉</div>`;
  } else if(state.sessionDone){
    const scorePct = total>0 ? Math.round((state.correctCount/total)*100) : 0;
    const failedInDeck = state.deck.filter(it=>state.reviewIds.has(it.card.id)).length;
    let verdict = '¡Sigue practicando!';
    if(scorePct >= 90) verdict = '¡Nivel de aprobación real! 🏆';
    else if(scorePct >= 70) verdict = 'Vas muy bien — este es el umbral aproximado de aprobación.';
    else if(scorePct >= 50) verdict = 'Vas a mitad de camino, repasa los dominios flojos.';
    stageHtml = `
      <div class="end-screen">
        <div class="mono" style="color:var(--muted); font-size:0.75rem; letter-spacing:0.04em;">EXAMEN COMPLETADO — ${catName(state.activeCat)}</div>
        <div class="big-score">${scorePct}%</div>
        <p>${state.correctCount}/${total} correctas · racha máxima ${state.bestStreak}🔥<br>${verdict}</p>
        <div class="end-actions">
          ${failedInDeck > 0 ? `<button class="btn review-btn" onclick="reviewFailed()">😅 Repasar solo las falladas (${failedInDeck})</button>` : ''}
          <button class="btn know-btn" onclick="restartSame()">🔀 Barajar y repetir examen</button>
          <button class="btn ghost" onclick="startDeck('all')">Ver todas las categorías</button>
        </div>
      </div>
    `;
  } else {
    const item = state.deck[state.index];
    const card = item.card;

    const optionsHtml = item.shuffledOptions.map((opt, idx) => {
      let cls = 'mc-option';
      if(state.answered){
        const isCorrectOpt = opt === card.mc.correct;
        if(isCorrectOpt) cls += ' correct-answer';
        else if(idx === state.selectedIdx) cls += ' wrong-answer';
        else cls += ' dimmed';
      }
      return `<button class="${cls}" ${state.answered?'disabled':''} onclick="selectOption(${idx})"><span class="opt-letter">${LETTERS[idx]}</span>${opt}</button>`;
    }).join('');

    const bLabel = badgeLabel(card.badge);
    const feedbackHtml = state.answered ? `
      <div class="mc-feedback">
        <div class="verdict ${state.lastCorrect?'ok':'bad'}">${state.lastCorrect ? '✅ ¡Correcto!' : '❌ Incorrecto'}</div>
        <div class="explain">${card.a}</div>
        ${bLabel ? `<div class="badge-tag ${card.badge}">${bLabel}</div>` : ''}
      </div>
    ` : '';

    stageHtml = `
      <div class="mc-panel">
        <div class="kicker">${catName(card.cat)} · Pregunta ${state.index+1} de ${total}</div>
        <div class="body-text">${card.q}</div>
        <div class="mc-options">${optionsHtml}</div>
        ${feedbackHtml}
      </div>
      ${state.answered ? `
        <div class="controls">
          <button class="btn next-btn" onclick="nextQuestion()">${state.index+1 >= total ? 'Ver resultado ➜' : 'Siguiente pregunta ➜'}</button>
        </div>
      ` : ''}
      <div class="util-row">
        <button onclick="startDeck(state.activeCat)">🔀 Barajar examen</button>
        <span class="mono" style="font-size:0.7rem; color:var(--muted-2);">${state.index+1} / ${total}</span>
      </div>
    `;
  }

  app.innerHTML = `
    <header>
      <div class="brand">
        <h1>☁ AWS Cloud Practitioner</h1>
        <p>Simulador de examen · basado en tu guía CLF-C02 (73 páginas)</p>
        <div class="tag">${CARDS.length} preguntas de opción múltiple · 13 dominios</div>
      </div>
      <div class="clf-badge mono">CLF-C02</div>
    </header>

    <div class="cat-scroll">
      <button class="chip ${state.activeCat==='all'?'active':''}" onclick="startDeck('all')">Todas</button>
      ${chips}
    </div>

    <div class="stats">
      <div class="stat">
        <span class="num">${total>0?Math.min(state.index+1,total):0}/${total}</span>
        <span class="lbl">Progreso</span>
      </div>
      <div class="stat streak">
        <span class="num">${state.streak}🔥</span>
        <span class="lbl">Racha actual</span>
      </div>
      <div class="stat mastered">
        <span class="num">${state.correctCount}</span>
        <span class="lbl">Correctas</span>
      </div>
      <div class="stat review">
        <span class="num">${state.reviewIds.size}</span>
        <span class="lbl">Por repasar</span>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${progressPct}%"></div>
    </div>

    ${stageHtml}
  `;
}

/* init */
startDeck('all');
</script>
</body>
</html>
